<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Business — Meeting Board</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Syne', 'sans-serif'],
            body: ['DM Sans', 'sans-serif'],
          },
          colors: {
            ink: '#0A0A0A',
            paper: '#F5F2EB',
            accent: '#FF4D1C',
            muted: '#8A8680',
            surface: '#EDEAE2',
            border: '#D8D4CC',
          },
          animation: {
            'fade-in': 'fadeIn 0.4s ease forwards',
            'slide-up': 'slideUp 0.35s ease forwards',
          },
          keyframes: {
            fadeIn: { from: { opacity: 0 }, to: { opacity: 1 } },
            slideUp: { from: { opacity: 0, transform: 'translateY(12px)' }, to: { opacity: 1, transform: 'translateY(0)' } },
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: #F5F2EB; color: #0A0A0A; }
    h1, h2, h3, h4, .font-display { font-family: 'Syne', sans-serif; }
    [contenteditable]:focus { outline: 2px solid #FF4D1C; outline-offset: 2px; border-radius: 4px; }
    [contenteditable]:empty:before { content: attr(data-placeholder); color: #B0ACA5; pointer-events: none; }
    .seg-btn.active { background: #0A0A0A; color: #F5F2EB; }
    .seg-btn { transition: background 0.15s, color 0.15s; }
    .progress-bar { transition: width 0.4s ease; }
    .card-expand { transition: max-height 0.35s ease, opacity 0.3s ease; max-height: 0; opacity: 0; overflow: hidden; }
    .card-expand.open { max-height: 1000px; opacity: 1; }
    .chevron { transition: transform 0.25s ease; }
    .chevron.open { transform: rotate(180deg); }
    input, textarea { font-family: 'DM Sans', sans-serif; background: transparent; }
    input:focus, textarea:focus { outline: 2px solid #FF4D1C; outline-offset: 1px; }
    .tag { font-family: 'Syne', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #EDEAE2; } ::-webkit-scrollbar-thumb { background: #C8C4BC; border-radius: 3px; }
    .nav-link { font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
    .hero-line { overflow: hidden; }
    @keyframes reveal { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .hero-line span { display: block; animation: reveal 0.7s cubic-bezier(0.16,1,0.3,1) forwards; }
    .hero-line:nth-child(2) span { animation-delay: 0.08s; }
    .hero-line:nth-child(3) span { animation-delay: 0.16s; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .noise { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.03; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E"); background-size: 128px; }
    .section-fade { opacity: 0; transform: translateY(20px); transition: opacity 0.5s ease, transform 0.5s ease; }
    .section-fade.visible { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body class="min-h-screen">
  <div class="noise"></div>

  <!-- NAV -->
  <nav class="sticky top-0 z-50 border-b border-border bg-paper/90 backdrop-blur-sm">
    <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-6 h-6 bg-accent rounded-sm flex items-center justify-center">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6h8M6 2v8" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <span class="font-display font-700 text-sm tracking-tight">AI Venture Board</span>
      </div>
      <div class="hidden md:flex items-center gap-8">
        <a href="#team" class="nav-link text-muted hover:text-ink transition-colors">Team</a>
        <a href="#ideas" class="nav-link text-muted hover:text-ink transition-colors">Ideas</a>
        <a href="#tasks" class="nav-link text-muted hover:text-ink transition-colors">Tasks</a>
      </div>
      <div class="flex items-center gap-2">
        <span class="status-dot bg-green-500"></span>
        <span class="text-xs text-muted font-body">May 2, 2026</span>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <section class="max-w-6xl mx-auto px-6 pt-16 pb-12 border-b border-border">
    <div class="flex items-start justify-between flex-wrap gap-6">
      <div>
        <p class="tag text-accent mb-4">AI Business Meeting · Session 01</p>
        <div class="hero-line"><span class="font-display text-5xl md:text-7xl font-800 leading-none tracking-tight">Build.</span></div>
        <div class="hero-line"><span class="font-display text-5xl md:text-7xl font-800 leading-none tracking-tight text-muted">Ship.</span></div>
        <div class="hero-line"><span class="font-display text-5xl md:text-7xl font-800 leading-none tracking-tight">Repeat.</span></div>
      </div>
      <div class="flex flex-col gap-3 pt-2">
        <div class="bg-surface border border-border rounded-xl px-5 py-4 min-w-[180px]">
          <p class="tag text-muted mb-1">Ideas</p>
          <p class="font-display text-3xl font-700" id="idea-count">4</p>
        </div>
        <div class="bg-surface border border-border rounded-xl px-5 py-4">
          <p class="tag text-muted mb-1">Team</p>
          <p class="font-display text-3xl font-700">4</p>
        </div>
        <div class="bg-surface border border-border rounded-xl px-5 py-4">
          <p class="tag text-muted mb-1">Tasks done</p>
          <p class="font-display text-3xl font-700" id="tasks-done-count">0 / 0</p>
        </div>
      </div>
    </div>
  </section>

  <!-- TEAM -->
  <section id="team" class="max-w-6xl mx-auto px-6 py-14 border-b border-border section-fade">
    <p class="tag text-accent mb-8">01 — Team</p>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="team-grid">
      <!-- cards injected by JS -->
    </div>
  </section>

  <!-- IDEAS -->
  <section id="ideas" class="max-w-6xl mx-auto px-6 py-14 border-b border-border section-fade">
    <div class="flex items-end justify-between mb-8 flex-wrap gap-4">
      <p class="tag text-accent">02 — Project Ideas</p>
      <button onclick="addIdea()" class="flex items-center gap-2 text-xs font-display font-600 border border-border rounded-lg px-4 py-2 hover:bg-surface transition-colors">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6h8M6 2v8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Add idea
      </button>
    </div>
    <div class="flex flex-col gap-3" id="ideas-list">
      <!-- injected by JS -->
    </div>
  </section>

  <!-- TASKS -->
  <section id="tasks" class="max-w-6xl mx-auto px-6 py-14 section-fade">
    <div class="flex items-end justify-between mb-8 flex-wrap gap-4">
      <p class="tag text-accent">03 — Action Items</p>
      <button onclick="addTask()" class="flex items-center gap-2 text-xs font-display font-600 border border-border rounded-lg px-4 py-2 hover:bg-surface transition-colors">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6h8M6 2v8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Add task
      </button>
    </div>
    <div class="flex flex-col gap-2" id="tasks-list">
      <!-- injected by JS -->
    </div>
    <p class="text-xs text-muted mt-6 font-body italic" id="tasks-empty">No tasks yet — click "Add task" to get started.</p>
  </section>

  <footer class="border-t border-border py-8 text-center">
    <p class="text-xs text-muted font-body">AI Venture Board · <span contenteditable data-placeholder="Add your team name">Team Name</span> · 2026</p>
  </footer>

<script>
// ─── DATA ───────────────────────────────────────────────
const TEAM = [
  { initials: 'JO', name: 'Joao',    role: 'Commercial Lead',  title: 'CEO',  color: 'bg-orange-100 text-orange-700' },
  { initials: 'FE', name: 'Felipe',  role: 'Product Lead',     title: 'CPO',  color: 'bg-violet-100 text-violet-700' },
  { initials: 'MA', name: 'Marlon',  role: 'Operations Lead',  title: 'COO',  color: 'bg-amber-100 text-amber-700'   },
  { initials: 'LE', name: 'Leandro', role: 'Tech Lead',        title: 'CTO',  color: 'bg-teal-100 text-teal-700'    },
];

const IDEAS = [
  {
    id: 'mensura',
    title: 'Mensura',
    concept: 'AI-powered inventory management tool for small businesses',
    description: '',
    market: '',
    revenue: '',
    effort: '',
    deadline: '',
    tags: ['B2B'],
    progress: 0,
  },
  {
    id: 'tourai',
    title: 'TourAI — City & Museum Tour',
    concept: 'AI-narrated virtual tours of cities and museums worldwide',
    description: '',
    market: 'Travelers, students, cultural institutions (B2C) + museums/tourism boards (B2B)',
    revenue: 'Freemium app + B2B licensing to museums and tourism boards',
    effort: '',
    deadline: '',
    tags: ['B2B', 'B2C'],
    progress: 0,
  },
  {
    id: 'transcript',
    title: 'TranscriptAI — Transcription & Translation',
    concept: 'AI transcription of audio/video into English text with optional translation',
    description: '',
    market: 'Content creators, podcasters, businesses, educators, non-native English speakers',
    revenue: 'Pay-per-minute credits + monthly subscriptions + API access for enterprise',
    effort: '',
    deadline: '',
    tags: ['B2B', 'B2C'],
    progress: 0,
  },
  {
    id: 'figurinha',
    title: 'FigurinhAI — World Cup Sticker App',
    concept: 'AI-generated stickers themed around the FIFA World Cup',
    description: '',
    market: 'General public',
    revenue: '',
    effort: '',
    deadline: '',
    tags: ['B2C'],
    progress: 0,
  },
];

let tasks = [];

// ─── TEAM ────────────────────────────────────────────────
function renderTeam() {
  const grid = document.getElementById('team-grid');
  grid.innerHTML = TEAM.map(m => `
    <div class="bg-white border border-border rounded-2xl p-5 flex flex-col gap-3 hover:border-accent transition-colors duration-200">
      <div class="w-12 h-12 rounded-xl ${m.color} flex items-center justify-center font-display font-700 text-sm">${m.initials}</div>
      <div>
        <p class="font-display font-700 text-base">${m.name}</p>
        <p class="text-xs text-muted mt-0.5">${m.role}</p>
      </div>
      <span class="tag text-accent self-start">${m.title}</span>
    </div>
  `).join('');
}

// ─── IDEAS ───────────────────────────────────────────────
function tagBadge(t) {
  return `<span class="tag px-2 py-0.5 rounded border border-border text-muted">${t}</span>`;
}

function effortColor(e) {
  return e === 'Low' ? 'bg-green-100 text-green-700' : e === 'Medium' ? 'bg-amber-100 text-amber-700' : e === 'High' ? 'bg-red-100 text-red-700' : 'bg-surface text-muted';
}

function renderIdeas() {
  const list = document.getElementById('ideas-list');
  list.innerHTML = IDEAS.map((idea, idx) => `
    <div class="bg-white border border-border rounded-2xl overflow-hidden idea-card" id="card-${idea.id}">
      <!-- HEADER -->
      <div class="flex items-center justify-between px-6 py-5 cursor-pointer hover:bg-surface/50 transition-colors" onclick="toggleIdea('${idea.id}')">
        <div class="flex items-center gap-4 flex-1 min-w-0">
          <span class="font-display font-700 text-2xl text-border w-8 shrink-0">${String(idx+1).padStart(2,'0')}</span>
          <div class="min-w-0">
            <p class="font-display font-700 text-base leading-tight">${idea.title}</p>
            <p class="text-xs text-muted mt-0.5 truncate">${idea.concept}</p>
          </div>
        </div>
        <div class="flex items-center gap-3 ml-4 shrink-0">
          <div class="hidden md:flex gap-1">${idea.tags.map(tagBadge).join('')}</div>
          ${idea.effort ? `<span class="tag px-2 py-0.5 rounded-full ${effortColor(idea.effort)}">${idea.effort}</span>` : ''}
          <svg class="chevron ${document.getElementById('expand-'+idea.id)?.classList.contains('open') ? 'open' : ''}" width="16" height="16" viewBox="0 0 16 16" fill="none" id="chev-${idea.id}"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>

      <!-- PROGRESS BAR -->
      <div class="h-0.5 bg-surface mx-6 rounded-full overflow-hidden">
        <div class="progress-bar h-full bg-accent rounded-full" id="prog-${idea.id}" style="width: ${idea.progress}%"></div>
      </div>

      <!-- EXPAND BODY -->
      <div class="card-expand" id="expand-${idea.id}">
        <div class="px-6 py-6 border-t border-border grid grid-cols-1 md:grid-cols-2 gap-5">

          <div class="md:col-span-2">
            <label class="tag text-muted block mb-2">Description</label>
            <div contenteditable data-placeholder="Add a full description of this idea..." class="min-h-[72px] text-sm leading-relaxed border border-border rounded-xl px-4 py-3 focus:border-accent" oninput="updateProgress('${idea.id}')">${idea.description}</div>
          </div>

          <div>
            <label class="tag text-muted block mb-2">Target Market</label>
            <div contenteditable data-placeholder="Who is this for?" class="text-sm border border-border rounded-xl px-4 py-3 min-h-[44px] focus:border-accent" oninput="updateProgress('${idea.id}')">${idea.market}</div>
          </div>

          <div>
            <label class="tag text-muted block mb-2">Revenue Model</label>
            <div contenteditable data-placeholder="How does this make money?" class="text-sm border border-border rounded-xl px-4 py-3 min-h-[44px] focus:border-accent" oninput="updateProgress('${idea.id}')">${idea.revenue}</div>
          </div>

          <div>
            <label class="tag text-muted block mb-2">Effort Estimate</label>
            <div class="flex border border-border rounded-xl overflow-hidden" id="eff-${idea.id}">
              ${['Low','Medium','High'].map(e => `
                <button class="seg-btn flex-1 py-2 text-xs font-display font-600 hover:bg-surface ${idea.effort === e ? 'active' : ''}"
                  onclick="selectEffort('${idea.id}','${e}',this)">${e}</button>
              `).join('<div class="w-px bg-border"></div>')}
            </div>
          </div>

          <div>
            <label class="tag text-muted block mb-2">MVP Deadline</label>
            <div contenteditable data-placeholder="Week # or date" class="text-sm border border-border rounded-xl px-4 py-3 min-h-[44px] focus:border-accent" oninput="updateProgress('${idea.id}')">${idea.deadline}</div>
          </div>

          <!-- Progress indicator -->
          <div class="md:col-span-2 flex items-center gap-3">
            <div class="flex-1 h-1.5 bg-surface rounded-full overflow-hidden">
              <div class="progress-bar h-full bg-accent rounded-full" id="prog2-${idea.id}" style="width: ${idea.progress}%"></div>
            </div>
            <span class="tag text-muted" id="prog-label-${idea.id}">${idea.progress}% filled</span>
          </div>

        </div>
      </div>
    </div>
  `).join('');
}

function toggleIdea(id) {
  const body = document.getElementById('expand-'+id);
  const chev = document.getElementById('chev-'+id);
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  chev.classList.toggle('open', !isOpen);
}

function selectEffort(id, val, btn) {
  const idea = IDEAS.find(i => i.id === id);
  if (idea) idea.effort = val;
  const group = document.getElementById('eff-'+id);
  group.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  // re-render header badge
  const card = document.getElementById('card-'+id);
  const existing = card.querySelector('.seg-btn.active');
  updateProgress(id);
}

function updateProgress(id) {
  const idea = IDEAS.find(i => i.id === id);
  const body = document.getElementById('expand-'+id);
  if (!body) return;
  const editables = body.querySelectorAll('[contenteditable]');
  let filled = 0;
  const total = editables.length + 1; // +1 for effort
  editables.forEach(el => { if (el.textContent.trim()) filled++; });
  if (idea.effort) filled++;
  const pct = Math.round((filled / total) * 100);
  idea.progress = pct;
  document.getElementById('prog-'+id).style.width = pct + '%';
  const p2 = document.getElementById('prog2-'+id);
  if (p2) p2.style.width = pct + '%';
  const lbl = document.getElementById('prog-label-'+id);
  if (lbl) lbl.textContent = pct + '% filled';
}

function addIdea() {
  const id = 'idea-' + Date.now();
  IDEAS.push({ id, title: 'New Idea', concept: '', description: '', market: '', revenue: '', effort: '', deadline: '', tags: [], progress: 0 });
  renderIdeas();
  setTimeout(() => toggleIdea(id), 50);
}

// ─── TASKS ───────────────────────────────────────────────
const OWNERS = ['Joao','Felipe','Marlon','Leandro'];

function renderTasks() {
  const list = document.getElementById('tasks-list');
  const empty = document.getElementById('tasks-empty');
  if (tasks.length === 0) { list.innerHTML = ''; empty.style.display = 'block'; updateTaskCount(); return; }
  empty.style.display = 'none';
  list.innerHTML = tasks.map((t, i) => `
    <div class="flex items-center gap-3 bg-white border border-border rounded-xl px-5 py-3 group animate-fade-in">
      <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${i})"
        class="w-4 h-4 rounded accent-[#FF4D1C] shrink-0 cursor-pointer" />
      <div contenteditable data-placeholder="Describe this task..." class="flex-1 text-sm ${t.done ? 'line-through text-muted' : ''} focus:outline-none" oninput="tasks[${i}].text=this.textContent">${t.text}</div>
      <select onchange="tasks[${i}].owner=this.value" class="text-xs border border-border rounded-lg px-2 py-1 bg-transparent font-display font-600 cursor-pointer">
        <option value="">Owner</option>
        ${OWNERS.map(o => `<option ${t.owner === o ? 'selected' : ''}>${o}</option>`).join('')}
      </select>
      <input type="text" value="${t.due}" placeholder="Due date" oninput="tasks[${i}].due=this.value"
        class="text-xs border border-border rounded-lg px-2 py-1 w-28 text-center" />
      <button onclick="deleteTask(${i})" class="opacity-0 group-hover:opacity-100 text-muted hover:text-accent transition-all ml-1">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
  `).join('');
  updateTaskCount();
}

function addTask() {
  tasks.push({ text: '', owner: '', due: '', done: false });
  renderTasks();
  const inputs = document.querySelectorAll('#tasks-list [contenteditable]');
  if (inputs.length) inputs[inputs.length-1].focus();
}

function toggleTask(i) {
  tasks[i].done = !tasks[i].done;
  renderTasks();
}

function deleteTask(i) {
  tasks.splice(i, 1);
  renderTasks();
}

function updateTaskCount() {
  const done = tasks.filter(t => t.done).length;
  document.getElementById('tasks-done-count').textContent = `${done} / ${tasks.length}`;
}

// ─── SCROLL REVEAL ───────────────────────────────────────
function initScrollReveal() {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
  }, { threshold: 0.1 });
  document.querySelectorAll('.section-fade').forEach(el => obs.observe(el));
}

// ─── INIT ────────────────────────────────────────────────
renderTeam();
renderIdeas();
renderTasks();
initScrollReveal();
</script>
</body>
</html>
